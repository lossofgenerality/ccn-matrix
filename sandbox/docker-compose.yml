# CCN Matrix sandbox: a private, local-only Matrix server where you and Claude
# can chat. Nothing federates; everything runs on this computer.
#   homeserver  Tuwunel (lightweight Rust Matrix server)  http://localhost:8008
#   element     Element Web (chat app in your browser)    http://localhost:8080
#   bot         CCN bot using matrix-org/matrix-js-sdk     (Claude's account)
# © Computational Classnotes · CC BY-NC-SA 4.0

name: ccn-matrix-sandbox

services:
  homeserver:
    image: jevolk/tuwunel:latest   # pin a version tag once the sandbox works for you
    restart: unless-stopped
    stop_grace_period: 30m         # lets database migrations finish on upgrade
    ports:
      - "127.0.0.1:8008:6167"      # bound to localhost only
    volumes:
      - ./data/tuwunel:/var/lib/tuwunel
    environment:
      TUWUNEL_SERVER_NAME: localhost
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_ADDRESS: 0.0.0.0
      TUWUNEL_PORT: 6167
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:?set REGISTRATION_TOKEN in .env}
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_TRUSTED_SERVERS: "[]"
      TUWUNEL_MAX_REQUEST_SIZE: 20000000

  element:
    image: vectorim/element-web:v1.12.35
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./element-config.json:/app/config.json:ro
    depends_on:
      - homeserver

  bot:
    build: ../bot
    restart: unless-stopped
    depends_on:
      - homeserver
    environment:
      HOMESERVER_URL: http://homeserver:6167
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:-claude}
      BOT_PASSWORD: ${BOT_PASSWORD:?set BOT_PASSWORD in .env}
      SANDBOX_INVITE: ${SANDBOX_INVITE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CONSTRUCT_PROXY_URL: ${CONSTRUCT_PROXY_URL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-4096}
      BOT_DISPLAY_NAME: ${BOT_DISPLAY_NAME:-Claude (CCN sandbox · automated)}
      SYSTEM_PROMPT_FILE: /app/prompts/briefing.md   # optional; edits apply on the next reply
    volumes:
      - ./prompts:/app/prompts:ro
